version: "3.9"

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
      POSTGRES_DB: crm_db
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    # DB tashqaridan ko'rinmaydi — faqat ichki network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend — port 1111 ───────────────────────────────────────────
  backend:
    build:
      context: ./backend_crm
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass@db:5432/crm_db
      SECRET_KEY: tmsiti-crm-super-secret-key-2026-production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
    ports:
      - "1111:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ── Next.js Frontend — port 2222 ──────────────────────────────────────────
  frontend:
    build:
      context: ./tmsiticrm
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://tmsiti.testyarat.uz
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    container_name: crm_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://tmsiti.testyarat.uz
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    ports:
      - "2222:3000"
    depends_on:
      - backend

  # ── Telegram: Hisobni bog'lash boti ────────────────────────────────────────
  telegram_bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: crm_telegram_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_INTERNAL_SECRET: ${BOT_INTERNAL_SECRET}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  crm_postgres_data:
